<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A2440" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Alicerce Run</title>
  </head>
  <body>
    <div id="stage">
      <div id="game-root"></div>

      <!-- Tela de inicio -->
      <section id="start-screen" class="overlay">
        <div class="brand">
          <img src="/logo/alicerce-branca.svg" alt="Alicerce" width="139" height="32" />
        </div>
        <h1>ALICERCE <span>RUN</span></h1>
        <p class="tagline">Construa a base da boa gestão pública</p>

        <div class="mode-toggle" role="tablist" aria-label="Modo de jogo">
          <button class="mode-btn is-active" data-mode="single" role="tab">1 jogador</button>
          <button class="mode-btn" data-mode="duo" role="tab">2 jogadores</button>
        </div>

        <div class="char-row">
          <div class="char-pick" data-player="0">
            <span class="char-caption">Personagem</span>
            <div class="char-cycler">
              <button class="char-arrow" data-dir="-1" aria-label="Personagem anterior">◀</button>
              <span class="char-emoji" aria-live="polite">🙂</span>
              <button class="char-arrow" data-dir="1" aria-label="Próximo personagem">▶</button>
            </div>
            <span class="char-name"></span>
          </div>
          <div class="char-pick is-hidden" data-player="1">
            <span class="char-caption">Jogador 2</span>
            <div class="char-cycler">
              <button class="char-arrow" data-dir="-1" aria-label="Personagem anterior">◀</button>
              <span class="char-emoji" aria-live="polite">🙂</span>
              <button class="char-arrow" data-dir="1" aria-label="Próximo personagem">▶</button>
            </div>
            <span class="char-name"></span>
          </div>
        </div>

        <button id="play-btn" class="primary">▶ JOGAR</button>

        <div class="start-foot">
          <button id="sound-toggle" class="ghost" aria-pressed="true">♫ Som: ligado</button>
          <span class="privacy">🔒 Jogue sem cadastro</span>
        </div>
        <p class="hint" id="controls-hint"></p>
      </section>

      <!-- Controles de toque (1 jogador) -->
      <div id="touch-controls" class="is-hidden" aria-hidden="true">
        <div class="pad-left">
          <button data-action="left" aria-label="Esquerda">◀</button>
          <button data-action="right" aria-label="Direita">▶</button>
        </div>
        <div class="pad-right">
          <button data-action="jump" aria-label="Pular">▲</button>
          <button data-action="duck" aria-label="Abaixar">▼</button>
        </div>
      </div>

      <!-- Tela de fim / ranking -->
      <section id="gameover-screen" class="overlay is-hidden">
        <div class="brand">
          <img src="/logo/alicerce-branca.svg" alt="Alicerce" width="122" height="28" />
        </div>
        <h2 id="go-title">VISÃO <span>CONSOLIDADA!</span></h2>
        <div class="score">
          <div class="score-n" id="go-score">0</div>
          <div class="score-u">pontos</div>
        </div>
        <div class="muni" id="go-muni"></div>

        <form id="lead-form" novalidate>
          <p class="form-legend">Entre no ranking do evento</p>
          <input type="text" name="nome" placeholder="Nome" autocomplete="name" required />
          <input type="text" name="orgao" placeholder="Órgão ou município" autocomplete="organization" />
          <input type="text" name="cargo" placeholder="Cargo" autocomplete="organization-title" />
          <input type="text" name="contato" placeholder="E-mail ou telefone (opcional)" autocomplete="email" />
          <label class="consent">
            <input type="checkbox" name="consentimento" />
            <span>Autorizo a Alicerce a me contatar sobre suas soluções (LGPD). Você pode jogar e entrar no ranking sem marcar esta opção.</span>
          </label>
          <button type="submit" class="primary">🏆 Entrar no ranking</button>
        </form>

        <div class="ranking">
          <div class="ranking-h">Ranking do evento</div>
          <ol id="ranking-list"></ol>
        </div>

        <div class="go-actions">
          <button id="replay-btn" class="primary">🔁 Jogar de novo</button>
          <button id="share-btn" class="ghost">🔗 Compartilhar</button>
        </div>
      </section>

      <div id="toast" class="is-hidden" role="status"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
