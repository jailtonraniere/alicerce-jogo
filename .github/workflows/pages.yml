# Publica o Alicerce Run no GitHub Pages a cada envio ao ramo main.
# Endereco: https://<usuario>.github.io/<repositorio>/ (versao 3D: acrescente ?3d)
#
# Antes da primeira execucao, no GitHub:
#  1. Settings > Pages > Build and deployment > Source: GitHub Actions
#  2. (opcional, para ranking e leads no Supabase) Settings > Secrets and variables > Actions:
#     - Variables: VITE_SUPABASE_URL e VITE_EVENTO
#     - Secrets:   VITE_SUPABASE_ANON_KEY (sempre a anon key, nunca a service role)
#     Sem essas variaveis o jogo funciona com ranking local no aparelho.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (checa tipos e gera dist/)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EVENTO: ${{ vars.VITE_EVENTO || 'demonstracao' }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
