# Publica o Alicerce Run no GitHub Pages a cada envio ao ramo main.
# Endereco: https://<usuario>.github.io/<repositorio>/ (versao 3D: acrescente ?3d)
#
# Antes da primeira execucao, no GitHub: Settings > Pages > Source: GitHub Actions.
#
# Supabase: URL, chave publica e evento padrao ficam no .env.production. Para
# sobrescrever sem mexer no codigo (ex.: nome do evento), crie em Settings >
# Secrets and variables > Actions as Variables VITE_EVENTO / VITE_SUPABASE_URL
# ou o Secret VITE_SUPABASE_ANON_KEY. So as preenchidas sao repassadas ao build.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (checa tipos e gera dist/)
        # variavel vazia do ambiente teria prioridade sobre o .env.production;
        # por isso so as preenchidas no GitHub sao exportadas
        run: |
          if [ -n "$GH_SUPABASE_URL" ]; then export VITE_SUPABASE_URL="$GH_SUPABASE_URL"; fi
          if [ -n "$GH_SUPABASE_KEY" ]; then export VITE_SUPABASE_ANON_KEY="$GH_SUPABASE_KEY"; fi
          if [ -n "$GH_EVENTO" ]; then export VITE_EVENTO="$GH_EVENTO"; fi
          npm run build
        env:
          GH_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          GH_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GH_EVENTO: ${{ vars.VITE_EVENTO }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
